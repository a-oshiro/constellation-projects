  <rect x="375" y="155" width="45" height="205" fill="#0a1020"/>
  <rect x="410" y="185" width="75" height="175" fill="#0d1525"/>
  <rect x="580" y="160" width="65" height="200" fill="#0a1020"/>
  <rect x="635" y="145" width="85" height="215" fill="#0d1525"/>
