<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 447" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04080f"/>
      <stop offset="45%" stop-color="#0a1628"/>
      <stop offset="80%" stop-color="#0d1e3a"/>
      <stop offset="100%" stop-color="#111f30"/>
    </linearGradient>
    <linearGradient id="road" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="42%" r="22%">
      <stop offset="0%" stop-color="#c8881a" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#c8881a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="28%" cy="50%" r="16%">
      <stop offset="0%" stop-color="#e8a030" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#e8a030" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="72%" cy="48%" r="16%">
      <stop offset="0%" stop-color="#d89020" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#d89020" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="1100" height="447" fill="url(#sky)"/>
  <!-- City glow halos on horizon -->
  <rect width="1100" height="447" fill="url(#glow1)"/>
  <rect width="1100" height="447" fill="url(#glow2)"/>
