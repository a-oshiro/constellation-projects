  <rect x="82" y="180" width="3" height="3" fill="#f0c060" opacity="0.7"/>
  <rect x="88" y="188" width="3" height="3" fill="#f0c060" opacity="0.6"/>
  <rect x="82" y="196" width="3" height="3" fill="#f0c060" opacity="0.8"/>
  <rect x="260" y="155" width="3" height="3" fill="#f0c060" opacity="0.7"/>
  <rect x="268" y="163" width="3" height="3" fill="#f0c060" opacity="0.6"/>
  <rect x="260" y="171" width="3" height="3" fill="#f0c060" opacity="0.8"/>
