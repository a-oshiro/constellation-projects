<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 447" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e0e0e"/>
      <stop offset="60%" stop-color="#1c1c1c"/>
      <stop offset="100%" stop-color="#252525"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2420"/>
      <stop offset="100%" stop-color="#1a1612"/>
    </linearGradient>
    <radialGradient id="light1" cx="30%" cy="80%" r="20%">
      <stop offset="0%" stop-color="#4a3820" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="light2" cx="75%" cy="85%" r="15%">
      <stop offset="0%" stop-color="#3a2e1a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1a1612" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Sky -->
  <rect width="1100" height="290" fill="url(#sky)"/>
  <!-- Ground/driveway -->
  <rect y="290" width="1100" height="157" fill="url(#ground)"/>
  <!-- Subtle warm light pools on ground -->
  <rect y="290" width="1100" height="157" fill="url(#light1)"/>
  <rect y="290" width="1100" height="157" fill="url(#light2)"/>
  <!-- Dark silhouette shapes suggesting architecture/foliage on right -->
  <rect x="720" y="60" width="380" height="230" fill="#141414" opacity="0.9"/>
  <rect x="820" y="30" width="180" height="260" fill="#181818" opacity="0.8"/>
  <rect x="880" y="50" width="120" height="180" fill="#1e1e1e" opacity="0.7"/>
  <!-- Foliage mass left -->
  <ellipse cx="120" cy="160" rx="180" ry="130" fill="#111" opacity="0.85"/>
  <ellipse cx="60" cy="200" rx="140" ry="110" fill="#0e0e0e" opacity="0.9"/>
  <!-- Steps/driveway edge lines -->
  <rect x="300" y="340" width="500" height="3" fill="#2e2820" opacity="0.6"/>
  <rect x="280" y="370" width="540" height="2" fill="#2e2820" opacity="0.4"/>
  <!-- Stone texture suggestion (subtle horizontal bands) -->
  <rect x="0" y="300" width="1100" height="1" fill="#333" opacity="0.3"/>
  <rect x="0" y="320" width="1100" height="1" fill="#333" opacity="0.2"/>
  <rect x="0" y="360" width="1100" height="1" fill="#333" opacity="0.2"/>
  <rect x="0" y="400" width="1100" height="1" fill="#333" opacity="0.2"/>
</svg>
