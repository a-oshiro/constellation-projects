<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 447" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b8cfe0"/>
      <stop offset="40%" stop-color="#c8d9e8"/>
      <stop offset="70%" stop-color="#dde8c8"/>
      <stop offset="100%" stop-color="#ccd4b0"/>
    </linearGradient>
    <linearGradient id="fieldL" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#7aab52"/>
      <stop offset="100%" stop-color="#5a8838"/>
    </linearGradient>
    <linearGradient id="fieldR" x1="1" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#6fa047"/>
      <stop offset="100%" stop-color="#527c30"/>
    </linearGradient>
    <linearGradient id="road" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#6e6e6e"/>
      <stop offset="100%" stop-color="#585858"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="65%" cy="12%" r="20%">
      <stop offset="0%" stop-color="#fff8e0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff8e0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="haze" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#ccd4b0" stop-opacity="0"/>
      <stop offset="40%" stop-color="#dde8d0" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#eef2e0" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <!-- Sky gradient -->
  <rect width="1100" height="447" fill="url(#sky)"/>
  <!-- Sun glow -->
  <rect width="1100" height="447" fill="url(#sunGlow)"/>
  <!-- Horizon haze -->
  <rect width="1100" height="447" fill="url(#haze)"/>
  <!-- Tree line on horizon -->
  <rect x="0" y="210" width="1100" height="40" fill="#4a7830" opacity="0.55"/>
  <ellipse cx="80" cy="215" rx="70" ry="35" fill="#4a7830" opacity="0.7"/>
  <ellipse cx="200" cy="220" rx="55" ry="28" fill="#3d6828" opacity="0.65"/>
  <ellipse cx="320" cy="218" rx="65" ry="30" fill="#4a7830" opacity="0.6"/>
  <ellipse cx="800" cy="214" rx="80" ry="36" fill="#4a7830" opacity="0.7"/>
  <ellipse cx="950" cy="220" rx="65" ry="30" fill="#3d6828" opacity="0.65"/>
  <ellipse cx="1050" cy="215" rx="75" ry="32" fill="#4a7830" opacity="0.6"/>
  <!-- Left green field -->
  <polygon points="0,240 420,240 310,447 0,447" fill="url(#fieldL)"/>
  <!-- Right green field -->
  <polygon points="680,240 1100,240 1100,447 790,447" fill="url(#fieldR)"/>
  <!-- Road surface -->
  <polygon points="420,240 680,240 790,447 310,447" fill="url(#road)"/>
  <!-- Road center dashes -->
  <rect x="540" y="270" width="20" height="30" fill="#888" opacity="0.6"/>
  <rect x="543" y="320" width="14" height="22" fill="#888" opacity="0.55"/>
  <rect x="546" y="356" width="10" height="17" fill="#888" opacity="0.5"/>
  <rect x="548" y="386" width="7" height="13" fill="#888" opacity="0.45"/>
  <!-- Road shoulder (left) -->
  <polygon points="420,240 450,240 340,447 310,447" fill="#a0a060" opacity="0.4"/>
  <!-- Road shoulder (right) -->
  <polygon points="650,240 680,240 790,447 760,447" fill="#a0a060" opacity="0.4"/>
  <!-- Field detail (subtle rows) -->
  <line x1="0" y1="300" x2="300" y2="300" stroke="#5a8838" stroke-width="1.5" opacity="0.35"/>
  <line x1="0" y1="340" x2="260" y2="340" stroke="#5a8838" stroke-width="1.5" opacity="0.3"/>
  <line x1="0" y1="380" x2="220" y2="380" stroke="#5a8838" stroke-width="1.5" opacity="0.25"/>
  <line x1="820" y1="300" x2="1100" y2="300" stroke="#527c30" stroke-width="1.5" opacity="0.35"/>
  <line x1="840" y1="340" x2="1100" y2="340" stroke="#527c30" stroke-width="1.5" opacity="0.3"/>
  <!-- Subtle warm overlay on bottom -->
  <rect y="350" width="1100" height="97" fill="#c8b870" opacity="0.08"/>
</svg>
